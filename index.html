<!DOCTYPE html>
<html>
<head>
    <title>School Ball Game</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #111; border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Ball attributes
        let ball = { x: 300, y: 200, radius: 15, dx: 4, dy: 4, color: "#ff4757" };
        // Paddle attributes
        let paddle = { width: 120, height: 15, x: 240, y: 370, speed: 8 };
        let rightPressed = false, leftPressed = false, score = 0;

        // Controls
        document.addEventListener("keydown", (e) => { if(e.key === "Right" || e.key === "ArrowRight") rightPressed = true; if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = true; });
        document.addEventListener("keyup", (e) => { if(e.key === "Right" || e.key === "ArrowRight") rightPressed = false; if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = false; });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Ball
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = ball.color; ctx.fill(); ctx.closePath();
            // Draw Paddle
            ctx.fillStyle = "#2ed573"; ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            // Draw Score
            ctx.fillStyle = "#fff"; ctx.font = "16px Arial"; ctx.fillText("Score: " + score, 8, 20);

            // Ball bounce off walls
            if(ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) ball.dx = -ball.dx;
            if(ball.y + ball.dy < ball.radius) ball.dy = -ball.dy;
            
            // Ball bounce off paddle or Game Over
            if(ball.y + ball.dy > paddle.y - ball.radius) {
                if(ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    ball.dy = -ball.dy;
                    score++;
                    ball.dx *= 1.05; // Speed up slightly
                    ball.dy *= 1.05;
                } else if(ball.y + ball.dy > canvas.height - ball.radius) {
                    alert("GAME OVER! Final Score: " + score);
                    document.location.reload();
                }
            }

            // Move Paddle
            if(rightPressed && paddle.x < canvas.width - paddle.width) paddle.x += paddle.speed;
            if(leftPressed && paddle.x > 0) paddle.x -= paddle.speed;

            ball.x += ball.dx; ball.y += ball.dy;
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
